name: 예약 업데이트

# 업데이트 PR의 공지(notices/*.md)에 적힌 deploy_at(한국 시간)에 맞춰
#  예정 공지 게시 → 그 시간에 PR 합치기 · 배포 → 완료 공지 게시 를 자동으로 한다 (scripts/scheduled-deploy.mjs)
#  · 15분마다 실행 (GitHub 예약 실행은 몇 분 ~ 30분쯤 늦을 수 있다). Actions 탭의 Run workflow로 바로 실행할 수도 있다
#  · 스크립트는 항상 main 의 것을 쓴다 (PR 쪽 코드는 실행하지 않는다)
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '확인만 하고 실제로 합치거나 배포하지 않기'
        type: boolean
        default: false

concurrency:
  group: scheduled-deploy
  cancel-in-progress: false

permissions:
  contents: write # 공지 파일을 main 에 올리고 PR 을 합친다
  pull-requests: write # PR 합치기 · 알림 댓글
  issues: write # PR 댓글
  actions: write # 배포 워크플로 실행
  checks: read # PR 의 CI 결과 확인

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: scripts
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/scheduled-deploy.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
