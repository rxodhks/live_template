name: Deploy to staging

# 테스트 사이트(https://staging.madang.party)에 브랜치를 배포한다. 실제 사이트(madang.party)는 건드리지 않는다.
#  · PR에 'staging' 라벨을 붙이면 그 PR의 브랜치를 배포하고, 라벨이 붙어 있는 동안 새로 올린 커밋도 다시 배포한다
#    (테스트 사이트는 하나뿐이라 마지막으로 배포한 브랜치가 보인다. 다 봤으면 라벨을 떼 주세요)
#  · Actions 탭 → Deploy to staging → Run workflow에서 브랜치를 골라 직접 배포할 수도 있다
# 테스트 사이트는 계정 · 템플릿 저장소가 실제 사이트와 완전히 분리된 다른 Worker(madang-staging)다.
# 필요한 저장소 Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (실제 배포와 같은 값)
# 로그인 설정
#  · 이메일: RESEND_API_KEY · EMAIL_FROM을 실제 사이트와 같이 쓴다
#  · 봇 확인: TURNSTILE_SITE_KEY/SECRET_KEY를 같이 쓴다 (Turnstile 위젯의 호스트 이름에 staging.madang.party를 추가해야 한다)
#  · Google · GitHub: 콜백 주소가 달라 기본으로는 끈다. 쓰려면 STAGING_GOOGLE_CLIENT_ID/SECRET, STAGING_GIT_CLIENT_ID/SECRET을 넣는다
on:
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    # 같은 저장소의 PR에서 'staging' 라벨이 붙은 경우만 (다른 저장소에서 온 PR에는 Secrets가 없다)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'staging'))
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.madang.party
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: 설정 확인
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 저장소 Secret이 없어 테스트 사이트에 배포할 수 없습니다."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 타입 검사
        run: npm run typecheck
      - name: 빌드 + 통합 테스트
        run: npm test
      - name: 배포 (wrangler deploy --env staging)
        working-directory: worker
        run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: 로그인 설정 옮기기 (저장소 Secrets → 테스트 Worker Secret)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.STAGING_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.STAGING_GOOGLE_CLIENT_SECRET }}
          GIT_CLIENT_ID: ${{ secrets.STAGING_GIT_CLIENT_ID }}
          GIT_CLIENT_SECRET: ${{ secrets.STAGING_GIT_CLIENT_SECRET }}
        # Worker가 있어야 Secret을 넣을 수 있어 배포 뒤에 옮긴다 (넣으면 바로 새 버전으로 적용). 값은 로그에 나오지 않는다
        run: |
          file="$RUNNER_TEMP/login-secrets.json"
          jq -n 'env | {RESEND_API_KEY, EMAIL_FROM, TURNSTILE_SITE_KEY, TURNSTILE_SECRET_KEY, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GIT_CLIENT_ID, GIT_CLIENT_SECRET}
            | with_entries(select(.value != null and .value != ""))' > "$file"
          if [ "$(jq 'length' "$file")" -gt 0 ]; then
            echo "옮기는 설정: $(jq -r 'keys | join(", ")' "$file")"
            npx wrangler secret bulk "$file" --env staging
          else
            echo "::warning::저장소 Secrets에 로그인 설정이 없습니다. 테스트 사이트에서 로그인하려면 RESEND_API_KEY를 넣어 주세요."
          fi
          rm -f "$file"
      - name: 접속 확인 (https://staging.madang.party)
        # 처음 도메인을 연결하면 인증서 발급에 몇 분 걸릴 수 있어 여러 번 확인한다
        run: |
          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 https://staging.madang.party/api/health; then
              echo
              echo "로그인 화면 설정: $(curl -fsS --max-time 10 https://staging.madang.party/api/auth/config)"
              echo "### 테스트 사이트에 배포했습니다: https://staging.madang.party (\`${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}\` @ \`${GITHUB_SHA::7}\`)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "아직 응답 없음 ($i/20) · 15초 후 다시 확인"
            sleep 15
          done
          echo "::error::배포는 끝났지만 https://staging.madang.party 가 아직 응답하지 않습니다. 대시보드의 Domains & Routes를 확인하세요."
          exit 1
