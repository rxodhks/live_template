name: Site check

# https://madang.party 가 정상 응답하는지, www 주소가 본 주소로 넘어가는지 확인한다.
#  · Actions 탭의 Run workflow로 언제든 실행할 수 있다
#  · 이 파일을 고칠 때도 한 번 실행된다
# 배포하지 않고 외부에서 접속만 해 보므로 Secrets가 필요 없다.
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/site-check.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 접속 확인
        run: |
          fail=0
          row() { echo "| $1 | $2 | $3 |" >> "$GITHUB_STEP_SUMMARY"; echo "[$1] $2 → $3"; }
          echo "| 결과 | 확인 | 응답 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"

          # 한 번만 요청해서 상태 코드와 이동할 주소를 본다
          hop() { curl -sS -o /dev/null --max-time 15 --retry 2 --retry-all-errors -w '%{http_code} %{redirect_url}' "$1" || echo "000 -"; }
          # 끝까지 따라가서 도착한 주소와 상태 코드를 본다
          follow() { curl -sS -L -o /dev/null --max-time 20 --retry 2 --retry-all-errors -w '%{http_code} %{url_effective} %{num_redirects}' "$1" || echo "000 - 0"; }

          # 1) 본 주소
          body=$(curl -sS --max-time 15 --retry 2 --retry-all-errors https://madang.party/api/health || true)
          if echo "$body" | grep -q '"ok":true'; then row "✅" "https://madang.party/api/health" "$body"; else row "❌" "https://madang.party/api/health" "${body:-응답 없음}"; fail=1; fi
          read -r code loc <<< "$(hop https://madang.party/)"
          if [ "$code" = "200" ]; then row "✅" "https://madang.party/" "HTTP $code"; else row "❌" "https://madang.party/" "HTTP $code ${loc}"; fail=1; fi

          # 2) www → 본 주소 (경로와 쿼리 유지, 한 번에 이동)
          for path in "/" "/join/test?x=1" "/t/abc/design?y=2"; do
            want="https://madang.party${path}"
            read -r code loc <<< "$(hop "https://www.madang.party${path}")"
            if [ "$loc" = "$want" ] && { [ "$code" = "301" ] || [ "$code" = "308" ]; }; then
              row "✅" "https://www.madang.party${path}" "$code → $loc"
            elif [ "$loc" = "$want" ]; then
              row "⚠️" "https://www.madang.party${path}" "$code → $loc (임시 이동 코드 · 301 권장)"
            else
              row "❌" "https://www.madang.party${path}" "$code → ${loc:-이동 없음} (기대: $want)"; fail=1
            fi
          done

          # 3) http://www 도 최종적으로 https 본 주소에 도착하는지
          read -r code url hops <<< "$(follow 'http://www.madang.party/join/test?x=1')"
          if [ "$url" = "https://madang.party/join/test?x=1" ] && [ "$code" = "200" ]; then
            row "✅" "http://www.madang.party/join/test?x=1" "이동 ${hops}번 → $url (HTTP $code)"
          else
            row "❌" "http://www.madang.party/join/test?x=1" "이동 ${hops}번 → $url (HTTP $code)"; fail=1
          fi

          # 4) http://madang.party 도 https로 넘어가는지 (Always Use HTTPS 설정)
          #    http로 열리면 비밀 노트 암호화(보안 연결 필요)가 동작하지 않고, 개인 공간 저장소도 https와 나뉜다
          read -r code url hops <<< "$(follow 'http://madang.party/join/test?x=1')"
          if [ "$url" = "https://madang.party/join/test?x=1" ] && [ "$code" = "200" ]; then
            row "✅" "http://madang.party/join/test?x=1" "이동 ${hops}번 → $url (HTTP $code)"
          else
            row "❌" "http://madang.party/join/test?x=1" "$url (HTTP $code) · SSL/TLS → Edge Certificates → Always Use HTTPS를 켜 주세요"; fail=1
          fi

          # 5) 로그인 화면에 쓸 수 있는 로그인 방법이 하나 이상 있는지
          auth=$(curl -sS --max-time 15 -w '\n%{http_code}' https://madang.party/api/auth/config || echo "- 000")
          code=$(printf '%s' "$auth" | tail -n1); body=$(printf '%s' "$auth" | head -n1)
          if [ "$code" = "200" ] && printf '%s' "$body" | grep -q 'true'; then
            row "✅" "https://madang.party/api/auth/config" "$body"
          elif [ "$code" = "404" ]; then
            row "ℹ️" "https://madang.party/api/auth/config" "로그인 기능 배포 전"
          else
            row "❌" "https://madang.party/api/auth/config" "HTTP $code $body · 사용할 수 있는 로그인 방법이 없습니다"; fail=1
          fi

          # 6) 외부 로그인 시작: 서버가 구글 · 깃허브 로그인 화면으로 보내고, 각 서비스가 우리 설정(클라이언트 ID · 돌아올 주소)을 받아들이는지
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'
          for p in google github; do
            start="https://madang.party/api/auth/oauth/$p"
            loc=$(curl -sS -o /dev/null --max-time 15 -w '%{redirect_url}' "$start" || true)
            case "$loc" in
              https://accounts.google.com/*|https://github.com/login/oauth/authorize*) ;;
              */login\?error=unavailable) row "ℹ️" "$start" "설정되지 않은 로그인 방법"; continue ;;
              *) row "❌" "$start" "로그인 화면으로 보내지 않음: ${loc:-응답 없음}"; fail=1; continue ;;
            esac
            back=$(printf '%s' "$loc" | grep -o 'redirect_uri=[^&]*' | sed 's/redirect_uri=//; s/%3A/:/g; s/%2F/\//g')
            # 설정이 맞으면 로그인 페이지(200)가 열리고, 클라이언트 ID나 돌아올 주소가 틀리면 오류(4xx) 페이지가 나온다
            page=$(curl -sS -L --max-redirs 5 --max-time 20 -A "$ua" -o /tmp/oauth.html -w '%{http_code} %{url_effective}' "$loc" || echo "000 -")
            status=${page%% *}
            if [ "$status" = "200" ] && ! printf '%s' "$page" | grep -q -E 'authError|oauth/error'; then
              row "✅" "$p 로그인 시작" "로그인 페이지 열림 · 돌아올 주소 $back"
            else
              err=$(grep -o -E 'redirect_uri_mismatch|invalid_client|deleted_client|disabled_client|The OAuth client was not found' /tmp/oauth.html | head -1)
              row "❌" "$p 로그인 시작" "HTTP $status ${err:-} · 돌아올 주소 $back"; fail=1
            fi
          done

          exit $fail
